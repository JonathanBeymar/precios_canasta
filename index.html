  <style>
    :root {
      --ink: #12303f;
      --brand: #1f445c;
      --muted: #5b7482;
      --line: #d5dfe4;
      --paper: #f3f6f8;
      --surface: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 24px; }

    header { background: var(--surface); border-bottom: 1px solid var(--line); }
    header .wrap {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding-top: 14px; padding-bottom: 14px;
    }
    .brand { display: inline-flex; align-items: center; }
    .brand img { height: 52px; width: auto; display: block; }
    .doc-label {
      font-size: 0.95rem; color: var(--muted);
      font-stretch: 112%; font-weight: 500;
    }

    main { flex: 1; padding: 40px 0 56px; }
    h1 {
      font-size: clamp(1.6rem, 3.2vw, 2.4rem);
      font-stretch: 125%; font-weight: 750;
      letter-spacing: -0.01em; line-height: 1.15;
      color: var(--brand);
    }
    .lead { margin-top: 10px; color: var(--muted); max-width: 60ch; }

    .report {
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 4px solid var(--brand);
      border-radius: 6px;
      overflow: hidden;
    }
    .report iframe {
      display: block; width: 100%; border: 0;
      aspect-ratio: 1 / 1; max-height: 1200px;
    }

    footer { background: var(--brand); color: #dbe7ee; }
    footer .wrap {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 8px 24px;
      padding-top: 20px; padding-bottom: 20px; font-size: 0.9rem;
    }
    footer strong { color: #fff; font-stretch: 118%; font-weight: 700; }

    a:focus-visible, iframe:focus-visible { outline: 3px solid #2a8fa8; outline-offset: 2px; }
    @media (max-width: 600px) {
      .wrap { padding: 0 14px; }
      .brand img { height: 40px; }
      main { padding: 24px 0 36px; }
    }
  </style>
